[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = { version = "0.3.34", features = ["cfg-target-has-atomic"] }
js-sys = "0.3.106"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["alloc", "derive", "rc"] }
serde-wasm-bindgen = "0.6.5"
slotmap = { version = "1.1.1", features = ["serde"] }
wasm-bindgen = { version = "0.2.129", features = ["serde", "serde-serialize", "serde_json"] }
wasm-bindgen-futures = "0.4.79"
wasm-bindgen-rayon = { version = "1.3.0", features = ["nightly"] }
web-sys = { version = "0.3.106", features = ["console"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1 
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4']
