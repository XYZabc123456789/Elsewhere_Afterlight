[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.106"
rayon = "1.12.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-rayon = { version = "1.3.0", features = ["nightly"] }
web-sys = { version = "0.3.106", features = ["console"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1 
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4']
