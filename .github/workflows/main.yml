name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install rust-lld
        shell: pwsh
        run: |
          rustup component add llvm-tools-preview

          $sysroot = rustc --print sysroot
          $llvmBin = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-msvc\bin"

          Write-Host "Rust LLVM directory:"
          Write-Host $llvmBin

          $rustLld = Join-Path $llvmBin "rust-lld.exe"

          if (-not (Test-Path $rustLld)) {
              Write-Error "rust-lld.exe was not found at $rustLld"
              exit 1
          }

          Write-Host "Found rust-lld"
          Write-Host $rustLld

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          wasm-pack --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
